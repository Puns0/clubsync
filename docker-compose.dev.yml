version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: clubsync
      POSTGRES_PASSWORD: clubsync_dev
      POSTGRES_DB: clubsync
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clubsync']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
